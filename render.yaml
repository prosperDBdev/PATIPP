# =============================================================================
# PATIPP API on Render
#
# THIS FILE ONLY APPLIES TO A SERVICE CREATED VIA "New > Blueprint".
#
# A service created through "New > Web Service" is configured entirely by its own
# dashboard settings and ignores this file — including rootDir, which is the one
# setting that stops the build failing with:
#
#   failed to read dockerfile: open Dockerfile: no such file or directory
#
# If that is the error you are looking at, set Root Directory to "backend" in the
# service's Settings tab. The name of the service is the quickest way to tell
# which kind you have: a Blueprint service is called "patipp-api", because that is
# what this file says.
#
# A Blueprint, so the service is defined here rather than clicked together in a
# dashboard — which means it can be recreated, reviewed in a diff, and is honest
# about what it runs.
#
# Render serves the frontend? No. The Next.js app is on Vercel; this file is the
# API only. See docs/DEPLOYMENT.md for why the two are split and why the /api
# rewrite on Vercel is load-bearing for authentication.
# =============================================================================

services:
  - type: web
    name: patipp-api
    runtime: docker

    # The repository holds both apps, so Render is pointed at the backend.
    #
    # rootDir is what actually does this: dockerfilePath alone is interpreted
    # relative to the repository root and was ignored, so the build looked for a
    # Dockerfile at the top level and failed with "no such file or directory".
    # With rootDir set, both paths below are relative to backend/ — which is also
    # what the Dockerfile expects, since it copies pom.xml and src/ from the root
    # of its build context.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Neon provisioned this database in us-east-1, so the service goes beside it.
    # Putting the API in Europe would add an Atlantic round trip to every query —
    # and the adaptive engine reads the whole learner model at session start.
    region: virginia
    plan: free                 # See the note on cold starts in DEPLOYMENT.md.

    # Flyway runs the migrations at boot and ddl-auto is `validate`, so a failed
    # migration fails the health check rather than serving against a wrong schema.
    healthCheckPath: /actuator/health

    envVars:
      # Render injects PORT itself; application.yml honours it.
      - key: PATIPP_CORS_ORIGINS
        value: https://patipp.ebitimi.dev

      # The refresh cookie is httpOnly and SameSite=Strict. Secure is mandatory
      # in production: without it the cookie would also travel over plain HTTP.
      - key: PATIPP_SECURE_COOKIE
        value: "true"

      # Secrets. `sync: false` means Render prompts for these on first deploy and
      # stores them encrypted — they are deliberately NOT in this file, which is
      # committed to a public repository.
      - key: PATIPP_DB_URL
        sync: false
      - key: PATIPP_DB_USER
        sync: false
      - key: PATIPP_DB_PASSWORD
        sync: false
      - key: PATIPP_JWT_SECRET
        sync: false

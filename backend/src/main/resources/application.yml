spring:
  application:
    name: patipp-api

  datasource:
    url: ${PATIPP_DB_URL:jdbc:postgresql://localhost:5432/patipp}
    username: ${PATIPP_DB_USER:patipp}
    password: ${PATIPP_DB_PASSWORD:}
    hikari:
      pool-name: patipp-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it and
    # never generates DDL - see docs/ARCHITECTURE.md section 11.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 32
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

  threads:
    virtual:
      enabled: true

server:
  port: ${PATIPP_PORT:8081}
  error:
    # Never leak internals. All errors are mapped to RFC 7807 ProblemDetail.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.patipp: DEBUG
    org.flywaydb: INFO

patipp:
  cors:
    # Exact origins only. Wildcards are invalid when credentials are sent.
    allowed-origins: ${PATIPP_CORS_ORIGINS:http://localhost:3000}

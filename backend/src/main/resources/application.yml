spring:
  application:
    name: patipp-api

  autoconfigure:
    exclude:
      # Without this, Spring Security creates an in-memory user and logs a generated
      # password at startup. Nothing can authenticate with it - basic and form login are
      # both disabled and every request goes through the JWT filter - but an unused
      # credential in the logs is noise that reads like a real one.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${PATIPP_DB_URL:jdbc:postgresql://localhost:5432/patipp}
    username: ${PATIPP_DB_USER:patipp}
    password: ${PATIPP_DB_PASSWORD:}
    hikari:
      pool-name: patipp-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it and
    # never generates DDL - see docs/ARCHITECTURE.md section 11.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 32
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

  threads:
    virtual:
      enabled: true

server:
  # PATIPP_PORT first, then PORT, then 8081.
  #
  # PORT is the convention every container host uses to tell a process which port to bind -
  # Render, Railway, Heroku and Cloud Run all inject it, and a service that ignores it binds
  # somewhere the platform is not listening and is marked unhealthy with no useful error. The
  # explicit PATIPP_PORT still wins, so local development keeps its fixed 8081.
  port: ${PATIPP_PORT:${PORT:8081}}
  error:
    # Never leak internals. All errors are mapped to RFC 7807 ProblemDetail.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.patipp: DEBUG
    org.flywaydb: INFO

patipp:
  cors:
    # Exact origins only. Wildcards are invalid when credentials are sent.
    allowed-origins: ${PATIPP_CORS_ORIGINS:http://localhost:3001}

  jwt:
    secret: ${PATIPP_JWT_SECRET}
    access-ttl-minutes: ${PATIPP_JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${PATIPP_JWT_REFRESH_TTL_DAYS:30}
    issuer: patipp
    # Local development runs on plain HTTP. Production MUST set this to true.
    secure-cookie: ${PATIPP_SECURE_COOKIE:false}
